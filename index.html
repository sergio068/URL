<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0F1923">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <title>Políglota</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0d1218;color:#e7edf3}
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;text-align:center}
    main{max-width:420px}h1{font-size:2rem;margin:0 0 8px}p{color:#9aa9b8;line-height:1.5}
    .mark{width:58px;height:58px;border:4px solid #55b9ff;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px}
    .mark:after{content:"";width:18px;height:18px;border-radius:50%;background:#55b9ff}
    .spin{width:22px;height:22px;border:3px solid #30404f;border-top-color:#55b9ff;border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    button{background:#55b9ff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Políglota</h1>
    <p id="status">Conectando con tu servidor…</p>
    <div class="spin" id="spin" aria-hidden="true"></div>
    <button id="retry" hidden>Reintentar</button>
  </main>
  <script>
    const status=document.querySelector('#status'),spin=document.querySelector('#spin'),retry=document.querySelector('#retry');
    const discovery='https://raw.githubusercontent.com/sergio068/URL/main/servidor-url.json';
    async function connect(){
      retry.hidden=true;spin.hidden=false;status.textContent='Conectando con tu servidor…';
      try{
        const r=await fetch(discovery+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('discovery');
        const j=await r.json(),url=String(j.url||'').trim();if(!/^https?:\/\//.test(url))throw new Error('offline');
        location.replace(url.replace(/\/$/,'')+'/');
      }catch(e){spin.hidden=true;retry.hidden=false;status.textContent='El servidor está temporalmente fuera de línea. Vuelve a intentarlo en unos segundos.'}
    }
    retry.onclick=connect;connect();
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  </script>
</body>
</html>
